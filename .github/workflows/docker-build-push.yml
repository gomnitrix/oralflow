name: Oralflow CI/CD

on:
  push:
    branches: ["main", "001-speaking-practice"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig.json"
      - "jest.config.ts"
      - ".eslintrc.json"
      - "playwright.config.ts"
      - ".github/workflows/**"
      # Exclude tools, docs and config examples
      - "!docs/**"
      - "!specs/**"
      - "!scripts/**"
      - "!**.md"
  workflow_dispatch:

env:
  DOCKER_USER: "gomnitrix"
  IMAGE_NAME: "oralflow"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment
        run: |
          curl -X POST "${{ secrets.DOKPLOY_ORALFLOW_WEBHOOK_URL }}" \
            -H "X-Deploy-Auth: ${{ secrets.DEPLOY_AUTH_TOKEN }}"
